      { block: 'უსაფრთხოება', question: 'რამდენად ცხადია შენთვის, სად უნდა მიმართო, თუ შენ ან [...]
      { block: 'უსაფრთხოება', question: 'რა დაეხმარებოდა ბულინგის/დამცირების პრევენციას თა[...]
      { block: 'უსაფრთხოება', question: 'რა გაგიმჯობესებდა უსაფრთხოების განცდას ონლაინ სივ[...]
      { block: 'უსაფრთხოება', question: 'რა დაგეხმარებოდა, უფრო თავდაჯერებულად იგრძო თავი �[...]

      { block: 'ინკლუზია და თანასწორობა', question: 'რა შეამცირებდა შეზღუდული შესაძლებლობი[...]
      { block: 'ინკლუზია და თანასწორობა', question: 'რა გახდის საჯარო სივრცეებს უფრო ხელმის�[...]
      { block: 'ინკლუზია და თანასწორობა', question: 'რა დაეხმარებოდა გოგონებსა და ბიჭებს თა�[...]
      { block: 'ინკლუზია და თანასწორობა', question: 'რა დაგეხმარებოდა, თუ ეთნიკური ან რელიგი[...]
      { block: 'ინკლუზია და თანასწორობა', question: 'რა გახდიდა ახალგაზრდულ ინიციატივებს უ��[...]

      { block: 'ქალაქის გარემო და ინფრასტრუქტურა', question: 'რომელი პრობლემა ყველაზე მეტა��[...]
      { block: 'ქალაქის გარემო და ინფრასტრუქტურა', question: 'რომელი ტრანსპორტის გაუმჯობეს[...]
      { block: 'ქალაქის გარემო და ინფრასტრუქტურა', question: 'სად გინდა, რომ გაუმჯობესდეს სა[...]
      { block: 'ქალაქის გარემო და ინფრასტრუქტურა', question: 'რა დაგეხმარებოდა გარემოსდაცვ[...]
      { block: 'ქალაქის გარემო და ინფრასტრუქტურა', question: 'თუ საბჭოს შენი უბნისთვის ერთი [...]

      { block: 'შენი იდეა', question: 'შენი იდეა: რა შეცვლიდა ცხოვრებას ქუთაისელი ახალგაზრ�[...]
    ];

    const totalQuestions = surveyQuestions.length;
    let activeStep = 0;
    let answers = Array(totalQuestions).fill(undefined);

    function renderQuestionCard(questionIndex) {
      const question = surveyQuestions[questionIndex];
      const currentValue = answers[questionIndex];
      const inputName = `q-${questionIndex}`;

      let markup = `
        <div class="space-y-6">
          <div class="inline-flex items-center gap-2 rounded-full border border-foam/30 bg-foam/10 px-3.5 py-1.5 text-xs font-mono font-medium tracking-wider text-foam">
            ${question.block}
          </div>

          <h2 class="font-display text-2xl font-bold leading-snug text-fog sm:text-3xl">
            <span class="text-gold font-mono mr-2">${questionIndex + 1}.</span>${question.question}
          </h2>

          <div class="mt-6 space-y-3">
      `;

      if (question.type === 'single') {
        question.options.forEach((option) => {
          const checked = currentValue === option;
          markup += `
            <label class="survey-card-option flex items-center justify-between gap-4 rounded-2xl border border-white/10 bg-white/5 p-4 text-left cursor-pointer transition hover:bg-white/10 ${chec[...]
              <span class="text-base leading-relaxed ${checked ? 'text-fog font-semibold' : 'text-fog/80'}">${option}</span>
              <input type="radio" name="${inputName}" value="${option}" ${checked ? 'checked' : ''}>
              <span class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full border ${checked ? 'border-gold bg-gold text-ink' : 'border-white/30'}">
                ${checked ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
              </span>
            </label>
          `;
        });
      } else {
        markup += `
          <div class="rounded-2xl border border-white/15 bg-ink/80 p-4 backdrop-blur-md">
            <textarea id="open-answer-${questionIndex}" rows="4" class="w-full bg-transparent text-base text-fog placeholder-fog/40 outline-none resize-none" placeholder="ჩაწერე შენ�[...]
          </div>
          <p class="text-xs leading-relaxed text-fog/50">მოერიდეთ პერსონალური მონაცემების (სახელი, გვარი, მისა[...]
        `;
      }

      markup += '</div></div>';
      surveyShell.innerHTML = markup;

      surveyShell.querySelectorAll('input, textarea').forEach((element) => {
        element.addEventListener('change', () => {
          if (element.type === 'radio') {
            answers[questionIndex] = element.value;
            renderQuestionCard(questionIndex);
            updateNextButtonState();
          } else if (element.tagName === 'TEXTAREA') {
            answers[questionIndex] = element.value;
            updateNextButtonState();
          }
        });
        element.addEventListener('input', () => {
          if (element.tagName === 'TEXTAREA') {
            answers[questionIndex] = element.value;
            updateNextButtonState();
          }
        });
      });

      updateNextButtonState();
    }

    function isQuestionAnswered(index) {
      const value = answers[index];
      if (value === undefined) return false;
      if (value === '__cannot_answer__') return true;
      return String(value).trim() !== '';
    }

    function updateNextButtonState() {
      if (activeStep < 1 || activeStep > totalQuestions) {
        surveyNext.disabled = false;
        return;
      }
      surveyNext.disabled = !isQuestionAnswered(activeStep - 1);
    }

    function updateSurveyUI() {
      if (activeStep === 0) {
        surveyShell.innerHTML = `
          <div class="text-left space-y-4">
            <h2 class="font-display text-3xl font-bold text-fog">მზად ხარ დასაწყებად?</h2>
            <p class="text-base leading-relaxed text-fog/75">კითხვები დაჯგუფებულია 10 თემატურ ბლოკად — სამოქალაქ��[...]
            <div class="inline-flex items-center gap-2 rounded-xl bg-white/5 border border-white/10 px-4 py-2 font-mono text-xs text-foam">
              <span>51 კითხვა</span> • <span>~8–10 წუთი</span>
            </div>
          </div>
        `;
        surveyBack.classList.add('hidden');
        surveySkip.classList.add('hidden');
        surveyNext.textContent = 'დაწყება';
        surveyCounter.textContent = 'დაწყება';
        surveyProgress.style.width = '0%';
        surveySummary.classList.add('hidden');
        return;
      }

      if (activeStep === totalQuestions + 1) {
        const answeredCount = answers.filter((value) => value !== undefined && value !== '__cannot_answer__' && value !== '').length;
        surveyAnswerCount.textContent = String(answeredCount);
        surveyJsonOutput.textContent = JSON.stringify(
          surveyQuestions.map((question, index) => ({
            block: question.block,
            question: question.question,
            answer: answers[index] ?? null
          })),
          null,
          2
        );
        surveyShell.innerHTML = '';
        surveySummary.classList.remove('hidden');
        surveyBack.classList.add('hidden');
        surveySkip.classList.add('hidden');
        surveyNext.classList.add('hidden');
        surveyCounter.textContent = 'დასრულდა';
        surveyProgress.style.width = '100%';
        return;
      }

      surveySummary.classList.add('hidden');
      surveyNext.classList.remove('hidden');
      surveyBack.classList.toggle('hidden', activeStep === 1);
      surveySkip.classList.remove('hidden');
      surveyNext.textContent = activeStep === totalQuestions ? 'დასრულება' : 'შემდეგი';
      surveyCounter.textContent = `${activeStep}/${totalQuestions}`;
      surveyProgress.style.width = `${(activeStep / totalQuestions) * 100}%`;
      renderQuestionCard(activeStep - 1);
      updateNextButtonState();
    }

    async function saveToSupabase() {
      const answeredCount = answers.filter(
        (value) => value !== undefined && value !== '__cannot_answer__' && value !== ''
      ).length;

      // Map the answers array into grouped thematic objects
      const payload = {
        answered_count: answeredCount,
        civic_engagement: answers.slice(0, 5),
        informal_education: answers.slice(5, 10),
        formal_education: answers.slice(10, 15),
        employment: answers.slice(15, 20),
        leisure_culture: answers.slice(20, 25),
        sports: answers.slice(25, 30),
        health_wellbeing: answers.slice(30, 35),
        safety: answers.slice(35, 40),
        inclusion_equality: answers.slice(40, 45),
        city_environment: answers.slice(45, 50),
        user_idea: answers[50] ?? null
      };

      try {
        const { data, error } = await supabaseClient
          .from('responses')
          .insert([payload]);

        if (error) {
          console.error('Supabase error:', error);
          return false;
        }
        return true;
      } catch (err) {
        console.error('Error saving response:', err);
        return false;
      }
    }

    surveyBack.addEventListener('click', () => {
      if (activeStep > 1) {
        activeStep -= 1;
        updateSurveyUI();
      }
    });

    surveySkip.addEventListener('click', () => {
      if (activeStep > 0 && activeStep <= totalQuestions) {
        answers[activeStep - 1] = '__cannot_answer__';
        activeStep += 1;
        updateSurveyUI();
      }
    });

    surveyNext.addEventListener('click', async () => {
      if (activeStep === 0) {
        activeStep = 1;
        updateSurveyUI();
        return;
      }

      if (activeStep >= 1 && activeStep <= totalQuestions && !isQuestionAnswered(activeStep - 1)) {
        return;
      }

      if (activeStep < totalQuestions) {
        activeStep += 1;
        updateSurveyUI();
      } else if (activeStep === totalQuestions) {
        await saveToSupabase();
        activeStep += 1;
        updateSurveyUI();
      }
    });

    surveyJsonButton.addEventListener('click', () => {
      surveyJsonOutput.classList.toggle('hidden');
    });

    updateSurveyUI();
  </script>
</body>
</html>
